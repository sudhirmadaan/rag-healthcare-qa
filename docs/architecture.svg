<text x="812.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Gemini</text>
<text x="812.0" y="278.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">primary, 3 retries, then lite fallback</text>
