<text x="615.0" y="60.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Embed (local)</text>
<text x="615.0" y="76.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">bge-small-en-v1.5, 384-d</text>
