<text x="540.0" y="164.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Postgres + pgvector (Supabase)</text>
<text x="540.0" y="180.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">HNSW index, cosine distance</text>
