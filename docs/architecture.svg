<text x="99.0" y="60.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">5 PDFs</text>
<text x="99.0" y="76.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">ABDM and FHIR docs</text>
