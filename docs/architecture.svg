<text x="615.0" y="340.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Log each call</text>
<text x="615.0" y="356.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">latency, tokens, cost</text>
<rect x="712" y="316" width="200" height="56" rx="8" fill="#E6F2EC" stroke="#2F855A" stroke-width="1.2"/>
<text x="812.0" y="340.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Answer</text>
<text x="812.0" y="356.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">cited [n] or "I can't find that"</text>
<line x1="812" y1="294" x2="812" y2="316" stroke="#5B6B7F" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="712" y1="344" x2="690" y2="344" stroke="#5B6B7F" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="8" y="398" width="924" height="150" rx="10" fill="none" stroke="#C5CED8" stroke-dasharray="4 4"/>
<text x="20" y="414" font-size="12" font-weight="600" fill="#5B6B7F">3. Evaluate (offline, 12-question golden set)</text>
