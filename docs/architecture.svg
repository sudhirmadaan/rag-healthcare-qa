<text x="24" y="508" font-size="11" fill="#5B6B7F">Gold phrases are offline labels only. They are not used in the live pipeline.</text>
<text x="24" y="526" font-size="11" fill="#5B6B7F">Known gaps: pure vector search (no keyword/hybrid), no relevance cutoff yet, LLM judge checks support, not completeness.</text>
