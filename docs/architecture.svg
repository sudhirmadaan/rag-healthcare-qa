<text x="99.0" y="448.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">questions.json</text>
<text x="99.0" y="464.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">10 answerable, 2 not</text>
<rect x="196" y="424" width="150" height="56" rx="8" fill="#EEF2F7" stroke="#5B6B7F" stroke-width="1.2"/>
<text x="271.0" y="448.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Gold labels</text>
<text x="271.0" y="464.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">phrase to gold chunk IDs</text>
<rect x="368" y="424" width="150" height="56" rx="8" fill="#EEF2F7" stroke="#5B6B7F" stroke-width="1.2"/>
<text x="443.0" y="448.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Run ask()</text>
<text x="443.0" y="464.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">same code as live</text>
