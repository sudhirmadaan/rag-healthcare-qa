<text x="615.0" y="448.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Score</text>
<text x="615.0" y="464.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">hit, rank, cites, judge</text>
