<text x="99.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Question</text>
<text x="99.0" y="278.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">user input</text>
<rect x="196" y="238" width="150" height="56" rx="8" fill="#EEF2F7" stroke="#5B6B7F" stroke-width="1.2"/>
<text x="271.0" y="262.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933">Embed query</text>
<text x="271.0" y="278.0" text-anchor="middle" font-size="11" font-weight="400" fill="#1F2933">same model + query prefix</text>
